services:
  app:
    container_name: meal
    build:
      context: .
      network: host
    ports:
      - "7000:3000"
    environment:
      DATABASE_URL: file:/app/data/mealplan.db
      AGENT_WEBHOOK_URL: ${AGENT_WEBHOOK_URL:-}
      AGENT_WEBHOOK_TOKEN: ${AGENT_WEBHOOK_TOKEN:-}
      AGENT_CHAT_WEBHOOK_URL: ${AGENT_CHAT_WEBHOOK_URL:-}
      AGENT_CHAT_WEBHOOK_TOKEN: ${AGENT_CHAT_WEBHOOK_TOKEN:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      MEAL_APP_NOTIFY_TOKEN: ${MEAL_APP_NOTIFY_TOKEN:-}
    volumes:
      - ./data:/app/data
